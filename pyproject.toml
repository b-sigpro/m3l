[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "m3l-toolkit"
authors = [{ name = "Yoshiaki Bando", email = "y.bando@aist.go.jp" }]
readme = "README.md"
license = { file = "LICENSE" }
description = "Multimodal Machine Listening Toolkit"

dependencies = [
    "aiaccel>=2026.10.2",
    "einops",
    "hydra-core",
    "kornia",
    "librosa",
    "lightning",
    "matplotlib",
    "numpy",
    "omegaconf>=2.4.0",
    "pyyaml",
    "resampy",
    "rich",
    "scipy",
    "seaborn",
    "sed_scores_eval",
    "soundfile",
    "timm",
    "torch",
    "torchaudio",
    "torchmetrics",
    "torchvision",
    "transformers",
    # "transformers==4.56.1",
    "rotary-embedding-torch>=0.8.9",
    "gradio>=6.14.0"
]

dynamic = ["version"]

[tool.hatch.version]
source = "vcs"

[project.urls]
Home = "https://ybando.jp"

[tool.hatch.build.targets.wheel]
packages = ["m3l"]