[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "m3l"
authors = [{ name = "Yoshiaki Bando", email = "y.bando@aist.go.jp" }]
readme = "README.md"
license = { file = "LICENSE" }
description = "Multimodal Machine Listening Toolkit"
version = "2026.10.0"

dependencies = [
    "aiaccel>=2026.6.0",
    "einops",
    "hydra-core@git+https://github.com/facebookresearch/hydra.git",
    "kornia",
    "librosa",
    "lightning",
    "matplotlib",
    "numpy",
    "omegaconf@git+https://github.com/omry/omegaconf.git",
    "pyyaml",
    "resampy",
    "rich",
    "scipy",
    "soundfile",
    "timm",
    "torch",
    "torchaudio",
    "torchmetrics",
    "torchvision",
]

[project.urls]
Home = "https://ybando.jp"
