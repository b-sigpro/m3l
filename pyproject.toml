[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "m3l"
authors = [{ name = "Yoshiaki Bando", email = "y.bando@aist.go.jp" }]
readme = "README.md"
license = { file = "LICENSE" }
description = "Multimodal Machine Listening Toolkit"
version = "2026.10.0"

dependencies = [
    "aiaccel>=2026.10.2",
    "einops",
    "hydra-core",
    "kornia",
    "librosa",
    "lightning",
    "matplotlib",
    "numpy",
    "omegaconf>=2.4.0",
    "pyyaml",
    "resampy",
    "rich",
    "scipy",
    "seaborn",
    "soundfile",
    "timm",
    "torch",
    "torchaudio",
    "torchmetrics",
    "torchvision",
    "transformers",
    # "transformers==4.56.1",
    "rotary-embedding-torch>=0.8.9",
    "gradio>=6.14.0"
]

[project.urls]
Home = "https://ybando.jp"
